<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="use-iframe" content="true">
<meta name="html-box-height-mode" content="auto">
<meta name="description" content="Linux学习路线：从基础到企业实践的顺序流程">
<title>Linux学习路线</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; background: #ffffff; color: #1F2329; }
  .wrap { width: 100%; max-width: 100%; padding: 8px 2px; }
  .title { font-size: 16px; font-weight: 600; color: #1F2329; margin-bottom: 16px; }
  .flow { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .step { display: inline-flex; align-items: center; gap: 8px; padding: 9px 14px; border: 1px solid #DEE3E8; border-radius: 8px; background: #ffffff; font-size: 14px; color: #1F2329; }
  .step .num { display: inline-flex; align-items: center; justify-content: center; width: 20px; height: 20px; border-radius: 50%; background: #C89B3C; color: #ffffff; font-size: 12px; font-weight: 600; }
  .arrow { color: #C89B3C; font-size: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="title">推荐学习路线（由基础到企业实践）</div>
  <div class="flow">
    <span class="step"><span class="num">1</span>Linux 基础</span><span class="arrow">→</span>
    <span class="step"><span class="num">2</span>文件操作</span><span class="arrow">→</span>
    <span class="step"><span class="num">3</span>用户权限</span><span class="arrow">→</span>
    <span class="step"><span class="num">4</span>软件安装</span><span class="arrow">→</span>
    <span class="step"><span class="num">5</span>进程管理</span><span class="arrow">→</span>
    <span class="step"><span class="num">6</span>网络</span><span class="arrow">→</span>
    <span class="step"><span class="num">7</span>Shell 脚本</span><span class="arrow">→</span>
    <span class="step"><span class="num">8</span>服务器部署</span><span class="arrow">→</span>
    <span class="step"><span class="num">9</span>性能优化</span><span class="arrow">→</span>
    <span class="step"><span class="num">10</span>企业实践</span>
  </div>
</div>
</body>
</html>
