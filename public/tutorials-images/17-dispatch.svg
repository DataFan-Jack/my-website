<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="32" y="44" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">MULTIPLE DISPATCH</text>
  <text x="32" y="84" fill="#1c1917" font-size="24" font-weight="400" font-family="'Instrument Serif', Georgia, serif">多重派发：按所有参数的类型选择方法</text>

  <!-- ===== 顶部：调用 ===== -->
  <rect x="336" y="136" width="288" height="56" rx="6" fill="#f6e8e3" stroke="#b5523a" stroke-width="1.2"/>
  <text x="480" y="164" fill="#b5523a" font-size="13" font-weight="600" text-anchor="middle" font-family="'Geist Mono', ui-monospace, Menlo, monospace">f(2.0, 3)</text>
  <text x="480" y="182" fill="rgba(181,82,58,0.7)" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">Float64 + Int64</text>

  <!-- 派发线 -->
  <line x1="480" y1="192" x2="480" y2="248" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <rect x="416" y="212" width="128" height="14" rx="2" fill="#faf7f2"/>
  <text x="480" y="223" fill="#65655c" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">查找方法表</text>

  <!-- ===== 中部：方法表 ===== -->
  <text x="96" y="272" fill="#78716c" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.12em">函数 f 的 3 个方法</text>

  <!-- 方法 1（焦点：被选中） -->
  <rect x="96" y="296" width="384" height="64" rx="6" fill="#f6e8e3" stroke="#b5523a" stroke-width="1.2"/>
  <text x="120" y="322" fill="#b5523a" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, monospace">f(x::Float64, y::Float64)</text>
  <text x="120" y="344" fill="rgba(181,82,58,0.7)" font-size="9">最具体的匹配 — 被选中执行</text>
  <rect x="408" y="308" width="56" height="24" rx="4" fill="#b5523a"/>
  <text x="436" y="324" fill="#ffffff" font-size="9" font-weight="600" text-anchor="middle">选中</text>

  <!-- 方法 2 -->
  <rect x="96" y="376" width="384" height="64" rx="6" fill="#ffffff" stroke="#a8a29e" stroke-width="1"/>
  <text x="120" y="402" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, monospace">f(x::Number, y::Number)</text>
  <text x="120" y="424" fill="#78716c" font-size="9">更宽泛 — 只有找不到更具体的方法时才用</text>

  <!-- 方法 3 -->
  <rect x="96" y="456" width="384" height="64" rx="6" fill="#ffffff" stroke="#a8a29e" stroke-width="1"/>
  <text x="120" y="482" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', ui-monospace, Menlo, monospace">f(x, y)</text>
  <text x="120" y="504" fill="#78716c" font-size="9">兜底方法 — 接受任意类型</text>

  <!-- ===== 右侧：说明 ===== -->
  <rect x="544" y="296" width="352" height="224" rx="6" fill="rgba(28,25,23,0.04)" stroke="rgba(28,25,23,0.3)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="576" y="332" fill="#78716c" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.12em">与传统 OOP 的区别</text>
  <g font-size="11">
    <text x="576" y="364" fill="#57534e">Python / Java：只看第一个参数</text>
    <text x="576" y="388" fill="#57534e">（self / this 对象）</text>
    <text x="576" y="424" fill="#1c1917">Julia：函数不属于任何类型，</text>
    <text x="576" y="448" fill="#1c1917">派发看全部参数的类型组合</text>
    <text x="576" y="484" fill="#78716c">methods(f) 可列出全部方法</text>
  </g>

  <!-- ===== 底部 ===== -->
  <line x1="32" y1="544" x2="928" y2="544" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
  <text x="32" y="568" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em">结果</text>
  <text x="120" y="568" fill="#1c1917" font-size="11" font-family="'Geist Mono', ui-monospace, Menlo, monospace">f(2.0, 3) = 2*2.0 - 3 = 1.0</text>
</svg>
