<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 648" width="800" height="648" role="img" aria-label="值语义与引用语义对比：var b = a 之后，值类型 b 是独立副本，改 b 不影响 a；引用类型 a 与 b 指向同一对象，改 b 影响 a。底部是 Array 的写时复制流程：赋值只复制缓冲区引用，首次写入且引用计数大于 1 时才真正复制出私有缓冲区">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
</marker>
</defs>

<rect width="100%" height="100%" fill="#faf7f2"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

<text x="40" y="36" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.18em">SWIFT · VALUE SEMANTICS</text>
<text x="40" y="60" fill="#1c1917" font-size="20" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif">值语义的复制 vs 引用语义的共享</text>
<line x1="40" y1="76" x2="760" y2="76" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>

<!-- connectors: branch -->
<line x1="400" y1="168" x2="400" y2="200" stroke="#57534e" stroke-width="1"/>
<line x1="200" y1="200" x2="600" y2="200" stroke="#57534e" stroke-width="1"/>
<line x1="200" y1="200" x2="200" y2="228" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="600" y1="200" x2="600" y2="228" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

<!-- top: assignment -->
<rect x="280" y="104" width="240" height="64" rx="6" fill="#faf7f2"/>
<rect x="280" y="104" width="240" height="64" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="288" y="112" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="312" y="121" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">ASSIGN</text>
<text x="400" y="146" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">var b = a</text>
<text x="400" y="162" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">把 a 赋给 b</text>

<!-- left: value type -->
<rect x="40" y="232" width="320" height="160" rx="6" fill="#faf7f2"/>
<rect x="40" y="232" width="320" height="160" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="48" y="240" width="48" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="72" y="249" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">VALUE</text>
<text x="200" y="276" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">值类型 struct / enum</text>
<text x="200" y="294" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">b 是独立副本</text>
<rect x="64" y="312" width="112" height="48" rx="6" fill="#faf7f2"/>
<rect x="64" y="312" width="112" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<text x="120" y="336" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">a</text>
<text x="120" y="352" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">1, 2, 3</text>
<rect x="224" y="312" width="112" height="48" rx="6" fill="#faf7f2"/>
<rect x="224" y="312" width="112" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<text x="280" y="336" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">b</text>
<text x="280" y="352" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">1, 2, 3</text>
<text x="200" y="380" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">改 b 不影响 a</text>

<!-- right: reference type -->
<rect x="440" y="232" width="320" height="160" rx="6" fill="#faf7f2"/>
<rect x="440" y="232" width="320" height="160" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="448" y="240" width="64" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="480" y="249" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">REFERENCE</text>
<text x="600" y="276" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">引用类型 class</text>
<text x="600" y="294" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">b 与 a 指向同一对象</text>
<line x1="492" y1="328" x2="536" y2="328" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="492" y1="352" x2="536" y2="352" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<text x="480" y="332" fill="#1c1917" font-size="9" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">a</text>
<text x="480" y="356" fill="#1c1917" font-size="9" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">b</text>
<rect x="544" y="312" width="112" height="48" rx="6" fill="#faf7f2"/>
<rect x="544" y="312" width="112" height="48" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
<text x="600" y="336" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">同一对象</text>
<text x="600" y="352" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">改这里都变</text>
<text x="600" y="380" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">改 b 影响 a</text>

<!-- cow section -->
<line x1="40" y1="432" x2="760" y2="432" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
<text x="40" y="460" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" letter-spacing="0.18em">COPY-ON-WRITE · ARRAY</text>

<line x1="240" y1="528" x2="312" y2="528" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="560" y1="528" x2="632" y2="528" stroke="#b5523a" stroke-width="1" marker-end="url(#arrow-accent)"/>

<rect x="40" y="488" width="200" height="80" rx="6" fill="#faf7f2"/>
<rect x="40" y="488" width="200" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="48" y="496" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="76" y="505" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">STEP 1</text>
<text x="140" y="524" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">赋值</text>
<text x="140" y="544" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">只复制缓冲区的引用</text>
<text x="140" y="560" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">引用计数加一</text>

<rect x="320" y="488" width="240" height="80" rx="6" fill="#faf7f2"/>
<rect x="320" y="488" width="240" height="80" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
<rect x="328" y="496" width="48" height="12" rx="2" fill="transparent" stroke="rgba(181,82,58,0.50)" stroke-width="0.8"/>
<text x="352" y="505" fill="#b5523a" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">COW</text>
<text x="440" y="524" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">首次写入 且 refcount &gt; 1</text>
<text x="440" y="544" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">才真正复制私有缓冲区</text>

<rect x="640" y="488" width="120" height="80" rx="6" fill="#faf7f2"/>
<rect x="640" y="488" width="120" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<rect x="648" y="496" width="56" height="12" rx="2" fill="transparent" stroke="rgba(28,25,23,0.40)" stroke-width="0.8"/>
<text x="676" y="505" fill="#57534e" font-size="8" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle" letter-spacing="0.08em">RESULT</text>
<text x="700" y="524" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist', -apple-system, 'Helvetica Neue', Arial, sans-serif" text-anchor="middle">私有副本</text>
<text x="700" y="544" fill="#57534e" font-size="9" font-family="'Geist Mono', 'SFMono-Regular', Menlo, Consolas, monospace" text-anchor="middle">互不影响</text>

<text x="400" y="608" fill="#57534e" font-size="12" font-family="'Instrument Serif', Georgia, 'Times New Roman', serif" font-style="italic" text-anchor="middle">共享 + 写入，两个条件同时满足才复制</text>
</svg>
