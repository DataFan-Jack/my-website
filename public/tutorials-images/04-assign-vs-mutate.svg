<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="32" y="44" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">ASSIGNMENT VS MUTATION</text>
  <text x="32" y="84" fill="#1c1917" font-size="24" font-weight="400" font-family="'Instrument Serif', Georgia, serif">赋值与修改：b = a 不会复制数组</text>

  <!-- ===== 左半：b = a 绑定 ===== -->
  <text x="64" y="148" fill="#78716c" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.12em">第一步  b = a</text>

  <!-- 变量名 a / b -->
  <rect x="64" y="184" width="96" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="112" y="214" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">a</text>
  <rect x="64" y="264" width="96" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="112" y="294" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">b</text>

  <!-- 同一个数组对象 -->
  <rect x="256" y="192" width="216" height="112" rx="6" fill="#f6e8e3" stroke="#b5523a" stroke-width="1.2"/>
  <text x="364" y="220" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">同一个数组对象</text>
  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="14" text-anchor="middle">
    <rect x="284" y="240" width="48" height="40" fill="#ffffff" stroke="#a8a29e" stroke-width="0.8"/><text x="308" y="266" fill="#1c1917">1</text>
    <rect x="332" y="240" width="48" height="40" fill="#ffffff" stroke="#a8a29e" stroke-width="0.8"/><text x="356" y="266" fill="#1c1917">2</text>
    <rect x="380" y="240" width="48" height="40" fill="#ffffff" stroke="#a8a29e" stroke-width="0.8"/><text x="404" y="266" fill="#1c1917">3</text>
  </g>

  <!-- 绑定箭头 -->
  <line x1="160" y1="208" x2="256" y2="236" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>
  <line x1="160" y1="288" x2="256" y2="262" stroke="#b5523a" stroke-width="1.2" marker-end="url(#arrow-accent)"/>

  <text x="64" y="352" fill="#57534e" font-size="10">两个名字指向同一块内存，</text>
  <text x="64" y="370" fill="#57534e" font-size="10">没有发生任何复制。</text>

  <!-- 分隔线 -->
  <line x1="496" y1="132" x2="496" y2="416" stroke="rgba(28,25,23,0.12)" stroke-width="0.8"/>

  <!-- ===== 右半：a[1] = 42 修改 ===== -->
  <text x="544" y="148" fill="#78716c" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.12em">第二步  a[1] = 42</text>

  <rect x="544" y="184" width="96" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="592" y="214" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">a</text>
  <rect x="544" y="264" width="96" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="592" y="294" fill="#1c1917" font-size="13" font-weight="600" text-anchor="middle">b</text>

  <!-- 修改后的数组（还是同一个对象） -->
  <rect x="728" y="192" width="200" height="112" rx="6" fill="#f6e8e3" stroke="#b5523a" stroke-width="1.2"/>
  <text x="828" y="220" fill="#b5523a" font-size="11" font-weight="600" text-anchor="middle">还是同一个对象</text>
  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="14" text-anchor="middle">
    <rect x="752" y="240" width="52" height="40" fill="#ffffff" stroke="#b5523a" stroke-width="1.2"/><text x="778" y="266" fill="#b5523a" font-weight="600">42</text>
    <rect x="804" y="240" width="52" height="40" fill="#ffffff" stroke="#a8a29e" stroke-width="0.8"/><text x="830" y="266" fill="#1c1917">2</text>
    <rect x="856" y="240" width="52" height="40" fill="#ffffff" stroke="#a8a29e" stroke-width="0.8"/><text x="882" y="266" fill="#1c1917">3</text>
  </g>

  <!-- 箭头：a 和 b 都指向它 -->
  <line x1="640" y1="208" x2="728" y2="236" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="640" y1="288" x2="728" y2="262" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <text x="544" y="352" fill="#57534e" font-size="10">修改的是对象本身的内容，</text>
  <text x="544" y="370" fill="#57534e" font-size="10">通过 b 看到的也是 42。</text>

  <!-- ===== 底部结论 ===== -->
  <line x1="32" y1="448" x2="928" y2="448" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
  <text x="32" y="478" fill="#57534e" font-size="10" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.14em">结论</text>
  <text x="112" y="478" fill="#1c1917" font-size="11">想要独立的副本，请使用 copy(b)；需要独立修改时，不要让两个名字共享同一个可变对象。</text>

  <!-- 底部补充：不可变类型对比 -->
  <rect x="32" y="504" width="896" height="60" rx="6" fill="rgba(28,25,23,0.04)" stroke="rgba(28,25,23,0.3)" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="64" y="530" fill="#57534e" font-size="10">对整数、字符串等不可变类型，赋值只是让名字指向新值：a = 2; a = 3 不会改变数字 2 本身。</text>
  <text x="64" y="550" fill="#78716c" font-size="9">递归复制所有嵌套元素用 deepcopy(b)</text>
</svg>
