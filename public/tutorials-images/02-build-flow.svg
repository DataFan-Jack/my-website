<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 480" width="880" height="480" role="img" aria-label="Swift 源码到运行的三条路径：Playground、命令行、SwiftPM">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="440" y="36" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" text-anchor="middle">Swift 源码到运行的三条路径</text>

  <!-- bus from source to each lane -->
  <path d="M144 112 H176 V368" fill="none" stroke="#57534e" stroke-width="1"/>
  <line x1="176" y1="112" x2="208" y2="112" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="176" y1="208" x2="208" y2="208" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="176" y1="288" x2="208" y2="288" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="176" y1="368" x2="208" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- arrows -->
  <line x1="368" y1="112" x2="432" y2="112" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="368" y1="288" x2="432" y2="288" stroke="#b5523a" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <line x1="368" y1="368" x2="432" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="592" y1="368" x2="656" y2="368" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- arrow label -->
  <rect x="376" y="268" width="48" height="16" fill="#faf7f2"/>
  <text x="400" y="279" fill="#b5523a" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">编译产出</text>

  <!-- lane labels -->
  <text x="208" y="80" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">PLAYGROUND</text>
  <text x="208" y="176" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">命令行 · 直接运行</text>
  <text x="208" y="256" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">命令行 · 编译运行</text>
  <text x="208" y="336" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">SWIFTPM</text>

  <!-- source node -->
  <rect x="32" y="88" width="112" height="48" rx="6" fill="#faf7f2"/>
  <rect x="32" y="88" width="112" height="48" rx="6" fill="#f2ede4" stroke="#57534e" stroke-width="1"/>
  <text x="88" y="110" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">hello.swift</text>
  <text x="88" y="126" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">源码文件</text>

  <!-- playground -->
  <rect x="208" y="88" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="208" y="88" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="288" y="110" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">Xcode Playground</text>
  <text x="288" y="126" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">边写边看</text>

  <rect x="432" y="88" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="432" y="88" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="512" y="110" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">实时结果</text>
  <text x="512" y="126" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">无需手动编译</text>

  <!-- swift direct -->
  <rect x="208" y="184" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="208" y="184" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="288" y="206" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">swift hello.swift</text>
  <text x="288" y="222" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">直接运行，不生成文件</text>

  <!-- swiftc focus -->
  <rect x="208" y="264" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="208" y="264" width="160" height="48" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="288" y="286" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">swiftc 编译</text>
  <text x="288" y="302" fill="#b5523a" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">swiftc hello.swift -o hello</text>

  <rect x="432" y="264" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="432" y="264" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="512" y="286" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">./hello</text>
  <text x="512" y="302" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">可执行文件</text>

  <!-- swiftpm -->
  <rect x="208" y="344" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="208" y="344" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="288" y="366" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">swift build</text>
  <text x="288" y="382" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">编译整个包</text>

  <rect x="432" y="344" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="432" y="344" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="512" y="366" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">.build/</text>
  <text x="512" y="382" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">构建产物目录</text>

  <rect x="656" y="344" width="160" height="48" rx="6" fill="#faf7f2"/>
  <rect x="656" y="344" width="160" height="48" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="736" y="366" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">swift run</text>
  <text x="736" y="382" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">编译并运行</text>

  <!-- legend -->
  <line x1="32" y1="424" x2="848" y2="424" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <rect x="32" y="444" width="16" height="16" rx="4" fill="#f2ede4" stroke="#57534e" stroke-width="1"/>
  <text x="56" y="456" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">源码输入</text>
  <rect x="160" y="444" width="16" height="16" rx="4" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
  <text x="184" y="456" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">编译为可执行文件（焦点）</text>
</svg>
