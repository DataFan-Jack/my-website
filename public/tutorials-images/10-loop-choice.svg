<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 688" width="960" height="688" role="img" aria-label="循环写法选择流程图：按次数或遍历对象是否已知选择 for-in、while、repeat-while，并用 break、continue 及带标签的跳转控制流程">
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
</pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
</marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
</marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
</marker>
</defs>
<rect width="100%" height="100%" fill="#faf7f2"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

<text x="32" y="44" fill="#1c1917" font-size="24" font-family="'Instrument Serif',Georgia,'Times New Roman',serif">循环写法怎么选</text>
<text x="32" y="68" fill="#57534e" font-size="12" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">for-in / while / repeat-while + break / continue</text>

<line x1="480" y1="144" x2="480" y2="192" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

<polyline points="360,248 192,248 192,384" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<polyline points="600,248 768,248 768,384" fill="none" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="480" y1="304" x2="480" y2="384" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

<rect x="244" y="228" width="64" height="16" fill="#faf7f2"/>
<text x="276" y="240" fill="#57534e" font-size="8" letter-spacing="0.08em" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">次数已知</text>
<rect x="652" y="228" width="64" height="16" fill="#faf7f2"/>
<text x="684" y="240" fill="#57534e" font-size="8" letter-spacing="0.08em" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">至少一次</text>
<rect x="448" y="328" width="64" height="16" fill="#faf7f2"/>
<text x="480" y="340" fill="#57534e" font-size="8" letter-spacing="0.08em" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">可能零次</text>

<ellipse cx="480" cy="120" rx="100" ry="24" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="480" y="126" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">需要重复执行</text>

<polygon points="480,192 600,248 480,304 360,248" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
<text x="480" y="253" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">次数或遍历对象已知？</text>

<rect x="72" y="384" width="240" height="72" rx="6" fill="#faf7f2"/>
<rect x="72" y="384" width="240" height="72" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="192" y="414" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">for-in</text>
<text x="192" y="434" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">遍历集合、区间、字典</text>

<rect x="360" y="384" width="240" height="72" rx="6" fill="#faf7f2"/>
<rect x="360" y="384" width="240" height="72" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="480" y="414" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">while</text>
<text x="480" y="434" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">先判断条件再执行</text>

<rect x="648" y="384" width="240" height="72" rx="6" fill="#faf7f2"/>
<rect x="648" y="384" width="240" height="72" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="768" y="414" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">repeat-while</text>
<text x="768" y="434" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">先执行再判断条件</text>

<text x="64" y="516" fill="#78716c" font-size="8" letter-spacing="0.08em" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">循环体内部控制</text>
<rect x="48" y="528" width="864" height="128" rx="8" fill="rgba(28,25,23,0.03)" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>

<rect x="72" y="552" width="240" height="80" rx="6" fill="#faf7f2"/>
<rect x="72" y="552" width="240" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="192" y="578" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">break</text>
<text x="192" y="598" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">立刻结束整个循环</text>
<text x="192" y="618" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">只作用于最内层循环</text>

<rect x="360" y="552" width="240" height="80" rx="6" fill="#faf7f2"/>
<rect x="360" y="552" width="240" height="80" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
<text x="480" y="578" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">continue</text>
<text x="480" y="598" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">只跳过本轮迭代</text>
<text x="480" y="618" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">直接进入下一轮</text>

<rect x="648" y="552" width="240" height="80" rx="6" fill="#faf7f2"/>
<rect x="648" y="552" width="240" height="80" rx="6" fill="rgba(181,82,58,0.08)" stroke="#b5523a" stroke-width="1"/>
<text x="768" y="578" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">break label</text>
<text x="768" y="598" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">continue label 同理</text>
<text x="768" y="618" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">作用于外层循环</text>
</svg>
