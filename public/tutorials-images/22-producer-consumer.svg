<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="'Geist', -apple-system, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#57534e"/></marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b5523a"/></marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

  <text x="32" y="44" fill="#78716c" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" letter-spacing="0.18em">PRODUCER - CONSUMER</text>
  <text x="32" y="84" fill="#1c1917" font-size="24" font-weight="400" font-family="'Instrument Serif', Georgia, serif">用 Channel 在任务之间传递数据</text>

  <!-- ===== 生产者 ===== -->
  <rect x="64" y="200" width="176" height="104" rx="6" fill="rgba(28,25,23,0.05)" stroke="#a8a29e" stroke-width="1"/>
  <rect x="72" y="208" width="80" height="14" rx="2" fill="transparent" stroke="rgba(87,83,78,0.4)" stroke-width="0.8"/>
  <text x="112" y="218" fill="#57534e" font-size="7" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle" letter-spacing="0.08em">TASK</text>
  <text x="152" y="248" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">生产者任务</text>
  <text x="152" y="270" fill="#57534e" font-size="9" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">put!(jobs, i)</text>
  <text x="152" y="288" fill="#78716c" font-size="9" text-anchor="middle">写入后 close(jobs)</text>

  <!-- ===== jobs 通道（焦点） ===== -->
  <rect x="320" y="200" width="200" height="104" rx="6" fill="#f6e8e3" stroke="#b5523a" stroke-width="1.2"/>
  <text x="420" y="230" fill="#b5523a" font-size="12" font-weight="600" text-anchor="middle">jobs 通道</text>
  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="12" text-anchor="middle">
    <rect x="336" y="248" width="40" height="32" fill="#ffffff" stroke="rgba(181,82,58,0.4)" stroke-width="0.8"/><text x="356" y="269" fill="#b5523a">1</text>
    <rect x="376" y="248" width="40" height="32" fill="#ffffff" stroke="rgba(181,82,58,0.4)" stroke-width="0.8"/><text x="396" y="269" fill="#b5523a">2</text>
    <rect x="416" y="248" width="40" height="32" fill="#ffffff" stroke="rgba(181,82,58,0.4)" stroke-width="0.8"/><text x="436" y="269" fill="#b5523a">3</text>
    <rect x="456" y="248" width="48" height="32" fill="transparent"/>
    <text x="480" y="269" fill="rgba(181,82,58,0.6)">…</text>
  </g>
  <text x="420" y="324" fill="#78716c" font-size="9" text-anchor="middle">先进先出 · 满了 put! 阻塞 · 空了 take! 阻塞</text>

  <!-- ===== 4 个工作者 ===== -->
  <g>
    <rect x="608" y="120" width="152" height="72" rx="6" fill="rgba(28,25,23,0.05)" stroke="#a8a29e" stroke-width="1"/>
    <text x="684" y="150" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">工作任务 1</text>
    <text x="684" y="172" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">take! → 处理 → put!</text>

    <rect x="608" y="208" width="152" height="72" rx="6" fill="rgba(28,25,23,0.05)" stroke="#a8a29e" stroke-width="1"/>
    <text x="684" y="238" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">工作任务 2</text>
    <text x="684" y="260" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">take! → 处理 → put!</text>

    <rect x="608" y="296" width="152" height="72" rx="6" fill="rgba(28,25,23,0.05)" stroke="#a8a29e" stroke-width="1"/>
    <text x="684" y="326" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">工作任务 3</text>
    <text x="684" y="348" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">take! → 处理 → put!</text>

    <rect x="608" y="384" width="152" height="72" rx="6" fill="rgba(28,25,23,0.05)" stroke="#a8a29e" stroke-width="1"/>
    <text x="684" y="414" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">工作任务 4</text>
    <text x="684" y="436" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">take! → 处理 → put!</text>
  </g>

  <!-- jobs → 工作者的箭头 -->
  <line x1="520" y1="228" x2="608" y2="156" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="252" x2="608" y2="244" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="276" x2="608" y2="332" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="520" y1="296" x2="608" y2="420" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== results 通道 ===== -->
  <rect x="320" y="392" width="200" height="104" rx="6" fill="rgba(28,25,23,0.05)" stroke="#57534e" stroke-width="1"/>
  <text x="420" y="422" fill="#1c1917" font-size="12" font-weight="600" text-anchor="middle">results 通道</text>
  <g font-family="'Geist Mono', ui-monospace, Menlo, monospace" font-size="10" text-anchor="middle">
    <rect x="336" y="440" width="80" height="32" fill="#ffffff" stroke="rgba(28,25,23,0.2)" stroke-width="0.8"/><text x="376" y="461" fill="#57534e">(1, 0.2s)</text>
    <rect x="416" y="440" width="88" height="32" fill="#ffffff" stroke="rgba(28,25,23,0.2)" stroke-width="0.8"/><text x="460" y="461" fill="#57534e">(4, 0.5s)</text>
  </g>

  <!-- 工作者 → results 的箭头 -->
  <line x1="608" y1="180" x2="520" y2="416" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="608" y1="264" x2="522" y2="428" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="608" y1="348" x2="522" y2="452" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <line x1="608" y1="432" x2="520" y2="470" stroke="#57534e" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#arrow)"/>

  <!-- 主任务消费 -->
  <rect x="64" y="404" width="176" height="72" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="152" y="434" fill="#1c1917" font-size="11" font-weight="600" text-anchor="middle">主任务收集结果</text>
  <text x="152" y="456" fill="#57534e" font-size="8" font-family="'Geist Mono', ui-monospace, Menlo, monospace" text-anchor="middle">take!(results)</text>

  <line x1="320" y1="444" x2="240" y2="442" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- ===== 底部 ===== -->
  <line x1="32" y1="500" x2="928" y2="500" stroke="rgba(28,25,23,0.10)" stroke-width="0.8"/>
  <text x="32" y="524" fill="#78716c" font-size="9">Channel 是线程安全的：多个任务可以同时读写同一个通道 · for x in jobs 会在通道关闭后自动结束循环</text>
</svg>
