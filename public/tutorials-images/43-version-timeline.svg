<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" role="img" aria-label="Swift 版本演进时间线，焦点为 5.5 与 6.0 两次并发跃迁">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="400" y="36" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" text-anchor="middle">Swift 版本演进</text>

  <!-- baseline -->
  <line x1="64" y1="160" x2="736" y2="160" stroke="rgba(28,25,23,0.40)" stroke-width="1"/>

  <!-- drop lines from axis to labels -->
  <line x1="80" y1="160" x2="80" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="144" y1="160" x2="144" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="208" y1="160" x2="208" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="272" y1="160" x2="272" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="400" y1="160" x2="400" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="528" y1="160" x2="528" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="656" y1="160" x2="656" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="720" y1="160" x2="720" y2="176" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>

  <!-- hairline drops for above-axis feature labels -->
  <line x1="80" y1="120" x2="80" y2="156" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="208" y1="120" x2="208" y2="156" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="400" y1="120" x2="400" y2="156" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="656" y1="120" x2="656" y2="156" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>

  <!-- event markers -->
  <circle cx="80" cy="160" r="4" fill="#1c1917"/>
  <circle cx="144" cy="160" r="4" fill="#1c1917"/>
  <circle cx="208" cy="160" r="4" fill="#1c1917"/>
  <circle cx="272" cy="160" r="4" fill="#1c1917"/>
  <circle cx="400" cy="160" r="4" fill="#1c1917"/>
  <circle cx="528" cy="160" r="6" fill="#b5523a"/>
  <circle cx="656" cy="160" r="4" fill="#1c1917"/>
  <circle cx="720" cy="160" r="6" fill="#b5523a"/>

  <!-- above-axis features -->
  <text x="80" y="112" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">首个正式版</text>
  <text x="208" y="112" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">API 大改·首参数标签</text>
  <text x="400" y="112" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">ABI 稳定</text>
  <text x="656" y="112" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">宏·package</text>

  <!-- versions -->
  <text x="80" y="192" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">1.0</text>
  <text x="144" y="192" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">2.0</text>
  <text x="208" y="192" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">3.0</text>
  <text x="272" y="192" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">4.0</text>
  <text x="400" y="192" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">5.0</text>
  <text x="528" y="192" fill="#b5523a" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">5.5</text>
  <text x="656" y="192" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">5.9</text>
  <text x="720" y="192" fill="#b5523a" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">6.0</text>

  <!-- years -->
  <text x="80" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2014</text>
  <text x="144" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2015</text>
  <text x="208" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2016</text>
  <text x="272" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2017</text>
  <text x="400" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2019</text>
  <text x="528" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2021</text>
  <text x="656" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2023</text>
  <text x="720" y="208" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">2024</text>

  <!-- below-axis features -->
  <text x="144" y="236" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">开源·错误处理</text>
  <text x="272" y="236" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">Codable·内存独占</text>
  <text x="528" y="236" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">async·await·actor</text>
  <text x="720" y="236" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">严格并发</text>

  <!-- legend -->
  <line x1="64" y1="272" x2="736" y2="272" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <circle cx="72" cy="296" r="4" fill="#b5523a"/>
  <text x="84" y="300" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">并发跃迁</text>
  <text x="736" y="300" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="end">横轴按年份等比排布</text>
</svg>
