<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="async/await 的挂起与恢复时序图">
  <defs>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(28,25,23,0.10)"/>
    </pattern>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57534e"/>
    </marker>
    <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#b5523a"/>
    </marker>
    <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#2563eb"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#faf7f2"/>
  <rect width="100%" height="100%" fill="url(#dots)" opacity="0.6"/>

  <text x="400" y="32" fill="#1c1917" font-size="20" font-family="'Instrument Serif',Georgia,'Times New Roman',serif" text-anchor="middle">async/await 的挂起与恢复</text>

  <!-- lifelines -->
  <line x1="160" y1="88" x2="160" y2="440" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="400" y1="88" x2="400" y2="440" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>
  <line x1="640" y1="88" x2="640" y2="440" stroke="rgba(28,25,23,0.20)" stroke-width="1" stroke-dasharray="3,3"/>

  <!-- time axis -->
  <line x1="40" y1="88" x2="40" y2="432" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="48" y="104" fill="#78716c" font-size="8" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" letter-spacing="0.08em">TIME</text>

  <!-- activation bars -->
  <rect x="156" y="112" width="8" height="104" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="156" y="312" width="8" height="68" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="396" y="112" width="8" height="104" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="396" y="264" width="8" height="116" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>
  <rect x="636" y="168" width="8" height="96" fill="rgba(28,25,23,0.06)" stroke="#57534e" stroke-width="0.8"/>

  <!-- messages -->
  <line x1="164" y1="128" x2="396" y2="128" stroke="#1c1917" stroke-width="1" marker-end="url(#arrow)"/>
  <line x1="404" y1="168" x2="636" y2="168" stroke="#57534e" stroke-width="1" marker-end="url(#arrow)"/>
  <path d="M404 200 H444 V216 H404" fill="none" stroke="#b5523a" stroke-width="1" marker-end="url(#arrow-accent)"/>
  <line x1="636" y1="264" x2="404" y2="264" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <line x1="404" y1="312" x2="164" y2="312" stroke="#b5523a" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow-accent)"/>

  <!-- message labels (masked) -->
  <rect x="248" y="108" width="64" height="16" fill="#faf7f2"/>
  <text x="280" y="119" fill="#1c1917" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">调用 await</text>
  <rect x="496" y="148" width="48" height="16" fill="#faf7f2"/>
  <text x="520" y="159" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">发起请求</text>
  <rect x="448" y="196" width="56" height="16" fill="#faf7f2"/>
  <text x="456" y="211" fill="#b5523a" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">SUSPENDED</text>
  <rect x="496" y="244" width="48" height="16" fill="#faf7f2"/>
  <text x="520" y="255" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">数据就绪</text>
  <rect x="260" y="292" width="48" height="16" fill="#faf7f2"/>
  <text x="284" y="303" fill="#b5523a" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">恢复执行</text>

  <!-- annotations -->
  <rect x="112" y="232" width="96" height="16" fill="#faf7f2"/>
  <text x="160" y="244" fill="#78716c" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">主线程被释放</text>
  <rect x="104" y="384" width="112" height="16" fill="#faf7f2"/>
  <text x="160" y="396" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">主线程继续执行</text>

  <!-- actors -->
  <rect x="88" y="48" width="144" height="40" rx="6" fill="#faf7f2"/>
  <rect x="88" y="48" width="144" height="40" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="160" y="66" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">主线程</text>
  <text x="160" y="82" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">MAIN</text>

  <rect x="328" y="48" width="144" height="40" rx="6" fill="#faf7f2"/>
  <rect x="328" y="48" width="144" height="40" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="400" y="66" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">协程</text>
  <text x="400" y="82" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">TASK</text>

  <rect x="568" y="48" width="144" height="40" rx="6" fill="#faf7f2"/>
  <rect x="568" y="48" width="144" height="40" rx="6" fill="#ffffff" stroke="#1c1917" stroke-width="1"/>
  <text x="640" y="66" fill="#1c1917" font-size="12" font-weight="600" font-family="'Geist',-apple-system,'Helvetica Neue',Arial,sans-serif" text-anchor="middle">网络请求</text>
  <text x="640" y="82" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace" text-anchor="middle">URLSESSION</text>

  <!-- legend -->
  <line x1="40" y1="464" x2="760" y2="464" stroke="rgba(28,25,23,0.12)" stroke-width="1"/>
  <line x1="40" y1="484" x2="72" y2="484" stroke="#1c1917" stroke-width="1" marker-end="url(#arrow)"/>
  <text x="80" y="488" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">调用</text>
  <line x1="168" y1="484" x2="200" y2="484" stroke="#57534e" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="208" y="488" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">返回</text>
  <circle cx="296" cy="484" r="4" fill="#b5523a"/>
  <text x="308" y="488" fill="#57534e" font-size="9" font-family="'Geist Mono','SFMono-Regular',Menlo,Consolas,monospace">挂起 / 恢复焦点</text>
</svg>
