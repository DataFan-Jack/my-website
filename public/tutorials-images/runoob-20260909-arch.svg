<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 400" width="100%" role="img" aria-label="Blender MCP 架构与数据流">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/>
    </marker>
  </defs>

  <style>
    .box { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; rx: 12; }
    .bar { stroke-width: 0; }
    .title { font: 600 17px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #1e293b; text-anchor: middle; }
    .desc  { font: 13px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #64748b; text-anchor: middle; }
    .flow  { font: 12.5px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #475569; text-anchor: middle; }
    .wire  { stroke: #475569; stroke-width: 1.8; fill: none; marker-end: url(#arr); }
    .feedback { stroke: #16a34a; stroke-width: 1.8; fill: none; marker-end: url(#arrGreen); }
    .fbtext { font: 12.5px 'PingFang SC','Microsoft YaHei',sans-serif; fill: #16a34a; text-anchor: middle; }
    .bg { fill: #f8fafc; stroke: #e2e8f0; }
  </style>

  <rect class="bg" x="0" y="0" width="960" height="400" rx="12"/>

  <!-- 用户 -->
  <rect class="box" x="25" y="110" width="170" height="120" rx="12"/>
  <rect class="bar" x="25" y="110" width="170" height="6" rx="3" fill="#f59e0b"/>
  <text class="title" x="110" y="158">你</text>
  <text class="desc" x="110" y="186">自然语言下达指令</text>
  <text class="desc" x="110" y="206">“做一条龙守着金币”</text>

  <!-- MCP 客户端 -->
  <rect class="box" x="265" y="110" width="180" height="120" rx="12"/>
  <rect class="bar" x="265" y="110" width="180" height="6" rx="3" fill="#2563eb"/>
  <text class="title" x="355" y="150">MCP 客户端</text>
  <text class="desc" x="355" y="176">Claude Code / Codex</text>
  <text class="desc" x="355" y="196">Claude Desktop 等</text>
  <text class="desc" x="355" y="216">理解意图，规划步骤</text>

  <!-- blender-mcp 服务 -->
  <rect class="box" x="515" y="110" width="180" height="120" rx="12"/>
  <rect class="bar" x="515" y="110" width="180" height="6" rx="3" fill="#7c3aed"/>
  <text class="title" x="605" y="150">blender-mcp 服务</text>
  <text class="desc" x="605" y="176">由 uvx 启动</text>
  <text class="desc" x="605" y="196">翻译 MCP 工具调用</text>
  <text class="desc" x="605" y="216">不需要装进 Blender</text>

  <!-- Blender -->
  <rect class="box" x="765" y="110" width="170" height="120" rx="12"/>
  <rect class="bar" x="765" y="110" width="170" height="6" rx="3" fill="#ea580c"/>
  <text class="title" x="850" y="150">Blender</text>
  <text class="desc" x="850" y="176">插件监听 Socket :9876</text>
  <text class="desc" x="850" y="196">bpy 执行 Python</text>
  <text class="desc" x="850" y="216">建模 / 材质 / 渲染</text>

  <!-- 正向箭头 -->
  <line class="wire" x1="195" y1="170" x2="263" y2="170"/>
  <text class="flow" x="229" y="152">说需求</text>

  <line class="wire" x1="445" y1="170" x2="513" y2="170"/>
  <text class="flow" x="479" y="152">工具调用</text>

  <line class="wire" x1="695" y1="170" x2="763" y2="170"/>
  <text class="flow" x="729" y="152">本机通信</text>

  <!-- 反馈回路 -->
  <path class="feedback" d="M 850 230 L 850 320 L 355 320 L 355 232"/>
  <text class="fbtext" x="602" y="308">截图与场景信息返回给 AI，AI 看到结果后决定下一步</text>
</svg>
